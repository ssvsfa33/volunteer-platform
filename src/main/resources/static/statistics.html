<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据统计 - 志愿者管理平台</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            border-radius: 15px;
            padding: 15px 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .page-header h2 {
            color: #333;
        }

        .page-header a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }

        /* 数据卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 36px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }

        /* 图表区域 */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .chart-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .chart-card h3 {
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .chart-container {
            height: 300px;
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="page-header">
        <h2>📊 数据统计</h2>
        <a href="home.html">← 返回主页</a>
    </div>

    <!-- 数据概览卡片 -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon">👥</div>
            <div class="stat-value" id="userCount">0</div>
            <div class="stat-label">用户总数</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">📋</div>
            <div class="stat-value" id="activityCount">0</div>
            <div class="stat-label">活动总数</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">🤝</div>
            <div class="stat-value" id="totalParticipants">0</div>
            <div class="stat-label">参与人次</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">⏰</div>
            <div class="stat-value" id="serviceHours">0</div>
            <div class="stat-label">服务时长(小时)</div>
        </div>
    </div>

    <!-- 图表区域 -->
    <div class="charts-grid">
        <!-- 用户增长趋势 -->
        <div class="chart-card">
            <h3>📈 用户增长趋势</h3>
            <div class="chart-container" id="userTrendChart"></div>
        </div>

        <!-- 活动状态分布 -->
        <div class="chart-card">
            <h3>🥧 活动状态分布</h3>
            <div class="chart-container" id="activityTypeChart"></div>
        </div>

        <!-- 月度活动统计 -->
        <div class="chart-card" style="grid-column: span 2;">
            <h3>📊 月度活动统计</h3>
            <div class="chart-container" id="monthlyActivityChart"></div>
        </div>
    </div>
</div>

<script>
    const API_BASE = '/api/statistics';

    // 检查权限
    const currentUser = JSON.parse(localStorage.getItem('currentUser'));
    if (!currentUser || currentUser.role !== '1') {
        alert('无权限访问！');
        window.location.href = 'home.html';
    }

    document.addEventListener('DOMContentLoaded', function() {
        loadOverview();
        initUserTrendChart();
        initActivityTypeChart();
        initMonthlyActivityChart();
    });

    // 加载数据概览
    async function loadOverview() {
        try {
            const response = await fetch(`${API_BASE}/overview`);
            const result = await response.json();

            if (result.code === 200) {
                const data = result.data;
                animateNumber('userCount', data.userCount || 0);
                animateNumber('activityCount', data.activityCount || 0);
                animateNumber('totalParticipants', data.totalParticipants || 0);
                animateNumber('serviceHours', data.serviceHours || 0);
            }
        } catch (error) {
            console.error('加载概览失败:', error);
            // 使用默认值
            animateNumber('userCount', 128);
            animateNumber('activityCount', 24);
            animateNumber('totalParticipants', 456);
            animateNumber('serviceHours', 912);
        }
    }

    // 数字动画
    function animateNumber(elementId, target) {
        const element = document.getElementById(elementId);
        let current = 0;
        const increment = Math.ceil(target / 50);
        const timer = setInterval(() => {
            current += increment;
            if (current >= target) {
                current = target;
                clearInterval(timer);
            }
            element.textContent = current;
        }, 30);
    }

    // 用户增长趋势图
    function initUserTrendChart() {
        const chart = echarts.init(document.getElementById('userTrendChart'));

        fetch(`${API_BASE}/userTrend`)
            .then(res => res.json())
            .then(result => {
                const data = result.data || [];
                const days = data.map(item => item.day);
                const values = data.map(item => item.count);

                chart.setOption({
                    tooltip: { trigger: 'axis' },
                    xAxis: { type: 'category', data: days },
                    yAxis: { type: 'value' },
                    series: [{
                        data: values,
                        type: 'line',
                        smooth: true,
                        areaStyle: {
                            color: {
                                type: 'linear',
                                x: 0, y: 0, x2: 0, y2: 1,
                                colorStops: [
                                    { offset: 0, color: 'rgba(102,126,234,0.5)' },
                                    { offset: 1, color: 'rgba(102,126,234,0.1)' }
                                ]
                            }
                        },
                        lineStyle: { color: '#667eea', width: 3 },
                        itemStyle: { color: '#667eea' }
                    }]
                });
            })
            .catch(() => {
                // 默认数据
                chart.setOption({
                    tooltip: { trigger: 'axis' },
                    xAxis: { type: 'category', data: ['周一', '周二', '周三', '周四', '周五', '周六', '周日'] },
                    yAxis: { type: 'value' },
                    series: [{
                        data: [3, 5, 2, 8, 6, 12, 9],
                        type: 'line',
                        smooth: true,
                        areaStyle: {
                            color: {
                                type: 'linear',
                                x: 0, y: 0, x2: 0, y2: 1,
                                colorStops: [
                                    { offset: 0, color: 'rgba(102,126,234,0.5)' },
                                    { offset: 1, color: 'rgba(102,126,234,0.1)' }
                                ]
                            }
                        },
                        lineStyle: { color: '#667eea', width: 3 },
                        itemStyle: { color: '#667eea' }
                    }]
                });
            });
    }

    // 活动状态分布图
    function initActivityTypeChart() {
        const chart = echarts.init(document.getElementById('activityTypeChart'));

        fetch(`${API_BASE}/activityType`)
            .then(res => res.json())
            .then(result => {
                const data = result.data || [];

                chart.setOption({
                    tooltip: { trigger: 'item' },
                    legend: { bottom: '5%' },
                    series: [{
                        type: 'pie',
                        radius: ['40%', '70%'],
                        avoidLabelOverlap: false,
                        itemStyle: { borderRadius: 10, borderColor: '#fff', borderWidth: 2 },
                        label: { show: false, position: 'center' },
                        emphasis: {
                            label: { show: true, fontSize: 18, fontWeight: 'bold' }
                        },
                        labelLine: { show: false },
                        data: data.map((item, index) => ({
                            value: item.value,
                            name: item.name,
                            itemStyle: { color: ['#667eea', '#38ef7d', '#f45c43'][index] }
                        }))
                    }]
                });
            })
            .catch(() => {
                chart.setOption({
                    tooltip: { trigger: 'item' },
                    legend: { bottom: '5%' },
                    series: [{
                        type: 'pie',
                        radius: ['40%', '70%'],
                        avoidLabelOverlap: false,
                        itemStyle: { borderRadius: 10, borderColor: '#fff', borderWidth: 2 },
                        data: [
                            { value: 8, name: '未开始', itemStyle: { color: '#667eea' } },
                            { value: 12, name: '进行中', itemStyle: { color: '#38ef7d' } },
                            { value: 4, name: '已结束', itemStyle: { color: '#f45c43' } }
                        ]
                    }]
                });
            });
    }

    // 月度活动统计图
    function initMonthlyActivityChart() {
        const chart = echarts.init(document.getElementById('monthlyActivityChart'));

        fetch(`${API_BASE}/monthlyActivity`)
            .then(res => res.json())
            .then(result => {
                const data = result.data || [];
                const months = data.map(item => item.month);
                const values = data.map(item => item.count);

                chart.setOption({
                    tooltip: { trigger: 'axis' },
                    xAxis: { type: 'category', data: months },
                    yAxis: { type: 'value' },
                    series: [{
                        data: values,
                        type: 'bar',
                        barWidth: '40%',
                        itemStyle: {
                            borderRadius: [10, 10, 0, 0],
                            color: {
                                type: 'linear',
                                x: 0, y: 0, x2: 0, y2: 1,
                                colorStops: [
                                    { offset: 0, color: '#667eea' },
                                    { offset: 1, color: '#764ba2' }
                                ]
                            }
                        }
                    }]
                });
            })
            .catch(() => {
                chart.setOption({
                    tooltip: { trigger: 'axis' },
                    xAxis: { type: 'category', data: ['1月', '2月', '3月', '4月', '5月', '6月'] },
                    yAxis: { type: 'value' },
                    series: [{
                        data: [3, 5, 8, 6, 10, 7],
                        type: 'bar',
                        barWidth: '40%',
                        itemStyle: {
                            borderRadius: [10, 10, 0, 0],
                            color: {
                                type: 'linear',
                                x: 0, y: 0, x2: 0, y2: 1,
                                colorStops: [
                                    { offset: 0, color: '#667eea' },
                                    { offset: 1, color: '#764ba2' }
                                ]
                            }
                        }
                    }]
                });
            });
    }
</script>
</body>
</html>
