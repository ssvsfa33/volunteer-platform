<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活动中心 - 志愿者管理平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            border-radius: 15px;
            padding: 15px 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .page-header h2 {
            color: #333;
        }

        .page-header a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }

        .activity-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .activity-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .activity-title {
            font-size: 18px;
            color: #333;
            font-weight: bold;
        }

        .activity-tag {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .tag-active {
            background: #d4edda;
            color: #155724;
        }

        .tag-pending {
            background: #fff3cd;
            color: #856404;
        }

        .tag-ended {
            background: #f8d7da;
            color: #721c24;
        }

        .activity-content {
            color: #666;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .activity-info {
            display: flex;
            gap: 25px;
            color: #999;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .activity-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .progress-bar {
            flex: 1;
            margin-right: 20px;
        }

        .progress-text {
            font-size: 13px;
            color: #999;
            margin-bottom: 5px;
        }

        .progress-bg {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
            transition: width 0.3s;
        }

        .btn-join {
            padding: 10px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-join:hover {
            transform: translateY(-2px);
        }

        .btn-join:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            background: white;
            border-radius: 15px;
            color: #999;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        .toast-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .toast-error {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="page-header">
        <h2>🎯 志愿活动中心</h2>
        <a href="home.html">← 返回主页</a>
    </div>

    <div id="activityList">
        <div class="empty-state">加载中...</div>
    </div>
</div>

<script>
    // 检查登录
    const currentUser = JSON.parse(localStorage.getItem('currentUser'));
    if (!currentUser) {
        window.location.href = 'login.html';
    }

    // 加载活动列表
    async function loadActivities() {
        try {
            const response = await fetch('/api/activity/list');
            const result = await response.json();

            if (result.code === 200) {
                renderActivities(result.data || []);
            } else {
                // 没有接口时显示模拟数据
                renderMockActivities();
            }
        } catch (error) {
            console.error('加载活动失败:', error);
            renderMockActivities();
        }
    }

    // 模拟数据（如果没有后端接口）
    function renderMockActivities() {
        const mockData = [
            {
                id: 1,
                title: '社区环保志愿活动',
                content: '清理社区垃圾，美化环境，宣传环保知识',
                location: '阳光社区广场',
                startTime: '2024-03-15 09:00',
                maxNum: 30,
                currentNum: 12,
                status: 1
            },
            {
                id: 2,
                title: '敬老院慰问活动',
                content: '陪伴老人聊天，表演节目，送去温暖',
                location: '幸福敬老院',
                startTime: '2024-03-20 14:00',
                maxNum: 20,
                currentNum: 8,
                status: 1
            },
            {
                id: 3,
                title: '图书馆整理活动',
                content: '整理图书，分类上架，维护阅读环境',
                location: '市图书馆',
                startTime: '2024-03-25 10:00',
                maxNum: 15,
                currentNum: 15,
                status: 0
            }
        ];
        renderActivities(mockData);
    }

    // 渲染活动列表
    function renderActivities(activities) {
        const container = document.getElementById('activityList');

        if (!activities || activities.length === 0) {
            container.innerHTML = '<div class="empty-state">暂无活动</div>';
            return;
        }

        let html = '';
        activities.forEach(activity => {
            const percent = Math.round((activity.currentNum / activity.maxNum) * 100);
            const isFull = activity.currentNum >= activity.maxNum;

            let tagClass = 'tag-pending';
            let tagText = '未开始';
            if (activity.status === 1) {
                tagClass = 'tag-active';
                tagText = '进行中';
            } else if (activity.status === 2 || isFull) {
                tagClass = 'tag-ended';
                tagText = isFull ? '已满员' : '已结束';
            }

            html += `
                    <div class="activity-card">
                        <div class="activity-header">
                            <span class="activity-title">📋 ${activity.title}</span>
                            <span class="activity-tag ${tagClass}">${tagText}</span>
                        </div>
                        <div class="activity-content">${activity.content || '暂无描述'}</div>
                        <div class="activity-info">
                            <span>📍 ${activity.location || '待定'}</span>
                            <span>🕐 ${activity.startTime || '待定'}</span>
                        </div>
                        <div class="activity-footer">
                            <div class="progress-bar">
                                <div class="progress-text">已报名 ${activity.currentNum}/${activity.maxNum} 人</div>
                                <div class="progress-bg">
                                    <div class="progress-fill" style="width: ${percent}%"></div>
                                </div>
                            </div>
                            <button class="btn-join"
                                    onclick="joinActivity(${activity.id}, '${activity.title}')"
                                    ${isFull ? 'disabled' : ''}>
                                ${isFull ? '已满员' : '立即报名'}
                            </button>
                        </div>
                    </div>
                `;
        });

        container.innerHTML = html;
    }

    // 报名活动
    function joinActivity(activityId, activityTitle) {
        if (!confirm(`确认报名参加「${activityTitle}」？`)) return;

        // 这里可以调用报名接口
        showToast('报名成功！等待审核', 'success');
    }

    // 显示提示
    function showToast(message, type = 'success') {
        const toast = document.createElement('div');
        toast.className = `toast toast-${type}`;
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    loadActivities();
</script>
</body>
</html>
