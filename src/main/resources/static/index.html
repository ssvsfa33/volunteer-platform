<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>志愿者管理平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        /* 表单样式 */
        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .form-group {
            flex: 1;
            min-width: 200px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-sm {
            padding: 8px 15px;
            font-size: 12px;
        }

        /* 表格样式 */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #f8f9fa;
            color: #333;
            font-weight: bold;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .role-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .role-admin {
            background: #ffeeba;
            color: #856404;
        }

        .role-user {
            background: #d4edda;
            color: #155724;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        /* 提示消息 */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        .toast-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .toast-error {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>👥 志愿者管理平台</h1>

    <!-- 添加/编辑用户表单 -->
    <div class="card">
        <h2 id="formTitle">➕ 添加新用户</h2>
        <form id="userForm">
            <input type="hidden" id="userId">
            <div class="form-row">
                <div class="form-group">
                    <label>用户名 *</label>
                    <input type="text" id="username" placeholder="请输入用户名" required>
                </div>
                <div class="form-group">
                    <label>密码 *</label>
                    <input type="password" id="password" placeholder="请输入密码" required>
                </div>
                <div class="form-group">
                    <label>真实姓名</label>
                    <input type="text" id="realName" placeholder="请输入真实姓名">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>手机号</label>
                    <input type="text" id="phone" placeholder="请输入手机号">
                </div>
                <div class="form-group">
                    <label>角色</label>
                    <select id="role">
                        <option value="0">普通用户</option>
                        <option value="1">管理员</option>
                    </select>
                </div>
                <div class="form-group" style="flex: 0 0 auto; display: flex; align-items: flex-end;">
                    <button type="submit" class="btn btn-primary" id="submitBtn">保存</button>
                    <button type="button" class="btn btn-secondary" id="cancelBtn" style="margin-left: 10px; display: none;">取消</button>
                </div>
            </div>
        </form>
    </div>

    <!-- 用户列表 -->
    <div class="card">
        <h2>📋 用户列表</h2>
        <div id="userList">
            <div class="loading">加载中...</div>
        </div>
    </div>
</div>

<script>
    const API_BASE = '/api/user';
    let editingId = null;

    // 页面加载时获取用户列表
    document.addEventListener('DOMContentLoaded', loadUsers);

    // 表单提交
    document.getElementById('userForm').addEventListener('submit', handleSubmit);

    // 取消按钮
    document.getElementById('cancelBtn').addEventListener('click', cancelEdit);

    // 加载用户列表
    async function loadUsers() {
        try {
            const response = await fetch(`${API_BASE}/list`);
            const result = await response.json();

            if (result.code === 200) {
                renderUsers(result.data);
            } else {
                showToast('加载失败: ' + result.message, 'error');
            }
        } catch (error) {
            console.error('加载用户列表失败:', error);
            showToast('网络错误，请检查后端服务是否启动', 'error');
            document.getElementById('userList').innerHTML =
                '<div class="empty-state">❌ 无法连接到服务器，请确保后端已启动</div>';
        }
    }

    // 渲染用户列表
    function renderUsers(users) {
        const container = document.getElementById('userList');

        if (!users || users.length === 0) {
            container.innerHTML = '<div class="empty-state">暂无用户数据</div>';
            return;
        }

        let html = `
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>用户名</th>
                            <th>真实姓名</th>
                            <th>手机号</th>
                            <th>角色</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

        users.forEach(user => {
            const roleClass = user.role === '1' ? 'role-admin' : 'role-user';
            const roleName = user.role === '1' ? '管理员' : '普通用户';

            html += `
                    <tr>
                        <td>${user.id}</td>
                        <td><strong>${user.username}</strong></td>
                        <td>${user.realName || '-'}</td>
                        <td>${user.phone || '-'}</td>
                        <td><span class="role-badge ${roleClass}">${roleName}</span></td>
                        <td>
                            <div class="actions">
                                <button class="btn btn-success btn-sm" onclick="editUser(${user.id})">✏️ 编辑</button>
                                <button class="btn btn-danger btn-sm" onclick="deleteUser(${user.id}, '${user.username}')">🗑️ 删除</button>
                            </div>
                        </td>
                    </tr>
                `;
        });

        html += '</tbody></table>';
        container.innerHTML = html;
    }

    // 提交表单（添加或修改）
    async function handleSubmit(e) {
        e.preventDefault();

        const userData = {
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
            realName: document.getElementById('realName').value,
            phone: document.getElementById('phone').value,
            role: document.getElementById('role').value
        };

        try {
            let url = `${API_BASE}/add`;
            let method = 'POST';

            if (editingId) {
                url = `${API_BASE}/update`;
                userData.id = editingId;
            }

            const response = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(userData)
            });

            const result = await response.json();

            if (result.code === 200) {
                showToast(editingId ? '修改成功！' : '添加成功！', 'success');
                resetForm();
                loadUsers();
            } else {
                showToast('操作失败: ' + result.message, 'error');
            }
        } catch (error) {
            console.error('保存用户失败:', error);
            showToast('网络错误', 'error');
        }
    }

    // 编辑用户
    async function editUser(id) {
        try {
            const response = await fetch(`${API_BASE}/${id}`);
            const result = await response.json();

            if (result.code === 200 && result.data) {
                const user = result.data;
                editingId = id;

                document.getElementById('formTitle').textContent = '✏️ 编辑用户';
                document.getElementById('submitBtn').textContent = '更新';
                document.getElementById('cancelBtn').style.display = 'inline-block';

                document.getElementById('username').value = user.username || '';
                document.getElementById('password').value = user.password || '';
                document.getElementById('realName').value = user.realName || '';
                document.getElementById('phone').value = user.phone || '';
                document.getElementById('role').value = user.role || '0';

                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        } catch (error) {
            showToast('获取用户信息失败', 'error');
        }
    }

    // 删除用户
    async function deleteUser(id, username) {
        if (!confirm(`确定要删除用户 "${username}" 吗？`)) {
            return;
        }

        try {
            const response = await fetch(`${API_BASE}/${id}`, {
                method: 'DELETE'
            });

            const result = await response.json();

            if (result.code === 200) {
                showToast('删除成功！', 'success');
                loadUsers();
            } else {
                showToast('删除失败: ' + result.message, 'error');
            }
        } catch (error) {
            showToast('网络错误', 'error');
        }
    }

    // 取消编辑
    function cancelEdit() {
        resetForm();
    }

    // 重置表单
    function resetForm() {
        editingId = null;
        document.getElementById('formTitle').textContent = '➕ 添加新用户';
        document.getElementById('submitBtn').textContent = '保存';
        document.getElementById('cancelBtn').style.display = 'none';
        document.getElementById('userForm').reset();
    }

    // 显示提示消息
    function showToast(message, type = 'success') {
        const toast = document.createElement('div');
        toast.className = `toast toast-${type}`;
        toast.textContent = message;
        document.body.appendChild(toast);

        setTimeout(() => {
            toast.remove();
        }, 3000);
    }
</script>
</body>
</html>
