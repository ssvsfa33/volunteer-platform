<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主页 - 志愿者管理平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 顶部导航 */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            border-radius: 15px;
            padding: 15px 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .nav-logo {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .nav-links {
            display: flex;
            gap: 15px;
        }

        .nav-links a {
            text-decoration: none;
            color: #666;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .nav-user {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-user span {
            color: #333;
            font-weight: bold;
        }

        .btn-logout {
            padding: 8px 16px;
            background: #f5f5f5;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: #666;
            transition: all 0.3s;
        }

        .btn-logout:hover {
            background: #e0e0e0;
        }

        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .stat-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #999;
            font-size: 14px;
        }

        /* 功能卡片 */
        .function-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .function-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            text-decoration: none;
            color: inherit;
        }

        .function-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
        }

        .function-card h3 {
            font-size: 20px;
            color: #333;
            margin-bottom: 10px;
        }

        .function-card p {
            color: #999;
            font-size: 14px;
        }

        .function-card .icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .empty-state {
            text-align: center;
            padding: 20px;
            color: #999;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 导航栏 -->
    <div class="nav-bar">
        <div class="nav-logo">👥 志愿者管理平台</div>
        <div class="nav-links">
            <a href="home.html" class="active">🏠 主页</a>
            <a href="activity.html">📋 活动中心</a>
            <a href="activityManage.html" id="linkManage" style="display:none;">⚙️ 活动管理</a>
            <a href="userManage.html" id="linkUsers" style="display:none;">👥 用户管理</a>
            <a href="statistics.html" id="linkStats" style="display:none;">📊 数据统计</a>
        </div>
        <div class="nav-user">
            <span id="userName">游客</span>
            <button class="btn-logout" onclick="logout()">退出登录</button>
        </div>
    </div>

    <!-- 统计卡片 -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon">👥</div>
            <div class="stat-number" id="statUsers">0</div>
            <div class="stat-label">用户总数</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">📋</div>
            <div class="stat-number" id="statActivities">0</div>
            <div class="stat-label">活动总数</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">✅</div>
            <div class="stat-number" id="statRegistrations">0</div>
            <div class="stat-label">报名总数</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">🙋</div>
            <div class="stat-number" id="statVolunteers">0</div>
            <div class="stat-label">志愿者人数</div>
        </div>
    </div>

    <!-- 功能入口 -->
    <div class="function-grid">
        <a href="activity.html" class="function-card">
            <div class="icon">🎯</div>
            <h3>活动中心</h3>
            <p>浏览和报名参加志愿活动</p>
        </a>
        <a href="activityManage.html" class="function-card" id="cardManage" style="display:none;">
            <div class="icon">⚙️</div>
            <h3>活动管理</h3>
            <p>创建和管理志愿活动</p>
        </a>
        <a href="userManage.html" class="function-card" id="cardUsers" style="display:none;">
            <div class="icon">👥</div>
            <h3>用户管理</h3>
            <p>管理系统用户</p>
        </a>
        <a href="statistics.html" class="function-card" id="cardStats" style="display:none;">
            <div class="icon">📊</div>
            <h3>数据统计</h3>
            <p>查看系统数据概览</p>
        </a>
    </div>
</div>

<script>
    // 检查登录状态
    const currentUser = JSON.parse(localStorage.getItem('currentUser'));

    if (!currentUser) {
        window.location.href = 'login.html';
    } else {
        // 显示用户名
        document.getElementById('userName').textContent = currentUser.username;

        // 管理员显示管理入口
        if (currentUser.role === '1') {
            document.getElementById('linkManage').style.display = 'block';
            document.getElementById('linkUsers').style.display = 'block';
            document.getElementById('linkStats').style.display = 'block';
            document.getElementById('cardManage').style.display = 'block';
            document.getElementById('cardUsers').style.display = 'block';
            document.getElementById('cardStats').style.display = 'block';
        }
    }

    // 加载统计数据
    async function loadStats() {
        try {
            // 用户数
            const userRes = await fetch('/api/user/list');
            const userData = await userRes.json();
            document.getElementById('statUsers').textContent = (userData.data || []).length;

            // 活动数
            try {
                const actRes = await fetch('/api/activity/list');
                const actData = await actRes.json();
                document.getElementById('statActivities').textContent = (actData.data || []).length;
            } catch (e) {
                document.getElementById('statActivities').textContent = '--';
            }

            // 报名数
            try {
                const regRes = await fetch('/api/registration/list');
                const regData = await regRes.json();
                document.getElementById('statRegistrations').textContent = (regData.data || []).length;
            } catch (e) {
                document.getElementById('statRegistrations').textContent = '--';
            }

            // 志愿者数
            try {
                const volRes = await fetch('/api/volunteer/list');
                const volData = await volRes.json();
                document.getElementById('statVolunteers').textContent = (volData.data || []).length;
            } catch (e) {
                document.getElementById('statVolunteers').textContent = '--';
            }
        } catch (error) {
            console.error('加载统计数据失败:', error);
        }
    }

    loadStats();

    // 退出登录
    function logout() {
        localStorage.removeItem('currentUser');
        window.location.href = 'login.html';
    }
</script>
</body>
</html>
